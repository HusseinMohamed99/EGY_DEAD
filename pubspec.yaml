name: movies_app
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.6+6

environment:
  sdk: ^3.6.0

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.0
  dartz: ^0.10.1
  dio: ^5.7.0
  equatable: ^2.0.5
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.1.5
  firebase_remote_config: ^5.1.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_dotenv: ^5.2.1
  flutter_native_splash: ^2.4.4
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.14
  get_it: ^8.0.2
  google_mobile_ads: ^5.3.1
  package_info_plus: ^8.1.1
  skeletonizer: ^1.4.2
  stream_transform: ^2.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.14
  custom_lint_builder: ^0.7.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  pubspec_dependency_sorter: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - .env
flutter_assets:
  assets_path: assets/images/
  output_path: lib/
  filename: "image_assets.dart"
  field_prefix: null
