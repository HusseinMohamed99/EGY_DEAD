name: movies_app
description: A new Flutter project.

publish_to: "none"

version: 1.1.0+11

environment:
  sdk: ^3.8.0

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  connectivity_plus: ^6.1.4
  dartz: ^0.10.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  firebase_core: ^4.0.0
  firebase_remote_config: ^6.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^5.2.1
  flutter_native_splash: ^2.4.6
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.2.0
  get_it: ^8.2.0
  package_info_plus: ^8.3.0
  skeletonizer: ^2.1.0+1
  stream_transform: ^2.1.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.6.0
  custom_lint_builder: ^0.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pubspec_dependency_sorter: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - .env
    - shorebird.yaml
flutter_assets:
  assets_path: assets/images/
  output_path: lib/
  filename: "image_assets.dart"
  field_prefix: null
